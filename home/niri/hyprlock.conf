# hyprlock — screen locker (Super+Alt+L, see config.kdl)
#
# Works under Niri via the ext-session-lock-v1 protocol; nothing here needs
# Hyprland. PAM auth is wired up system-side by
# `security.pam.services.hyprlock` in modules/system/desktop.nix — without it
# hyprlock falls back to `su` and cannot unlock.
#
# Colors match the rest of the desktop (niri focus ring #7fc8ff, mako/fuzzel
# Tokyo Night background #1a1b26, border purple #703be7).

# Carved-stone Roman capitals for a dark-fantasy look (pkgs.cinzel, installed
# in modules/system/desktop.nix). The clock gets the flourished Decorative cut.
$font = Cinzel
$display = Cinzel Decorative

general {
    hide_cursor = true
    grace = 0            # no "move mouse to skip" window; always ask for the password
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

# Same wallpaper swaybg paints on the desktop, blurred and dimmed.
background {
    monitor =
    path = /home/xelo/Pictures/wallpaper.jpg
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.9
    brightness = 0.6
    vibrancy = 0.17
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    rounding = 10                       # matches fuzzel's border radius
    dots_center = true
    dots_spacing = 0.3
    dots_size = 0.25

    inner_color = rgba(1a1b26e6)
    outer_color = rgba(703be7ff)
    check_color = rgba(7fc8ffff)        # while authenticating
    fail_color = rgba(f7768eff)         # mako's critical red
    font_color = rgba(c0caf5ff)
    font_family = $font

    fade_on_empty = false
    placeholder_text = <span foreground="##8793b4"></span>
    fail_text = $PAMFAIL

    position = 0, -40
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME
    font_size = 88
    font_family = $display
    color = rgba(c5ccefff)

    position = 0, 180
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B %Y"
    font_size = 20
    font_family = $font
    color = rgba(8793b4ff)

    position = 0, 110
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text =   $DESC
    font_size = 14
    font_family = $font
    color = rgba(7fc8ffff)

    position = 0, 40
    halign = center
    valign = bottom
}
